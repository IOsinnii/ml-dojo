[project]
name = "ml-dojo"
version = "0.1.0"
description = "Introductory and cumulative machine learning, for bioinformatics and clinical systems biology"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "ipykernel",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "nbconvert",
]

[tool.uv]
package = false
python-preference = "only-managed"

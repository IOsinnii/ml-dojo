[project]
name = "ml-primer"
version = "0.1.0"
description = "Machine learning primer for bioinformatics and clinical systems biology"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "statsmodels",
    "ipykernel",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "nbconvert",
]

[tool.uv]
package = false
